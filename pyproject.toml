[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pantry-telegram-bot"
version = "0.1.0"
description = "Telegram bot that keeps a home pantry from text, receipt and product photos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.15,<4",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
pantry-bot = "pantry_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["pantry_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
